<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyash Awards · Голосование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --card-bg: rgba(16, 16, 20, 0.88);
      --text-primary: #f0f0f0;
      --text-secondary: #b0b0b0;
      --text-muted: #777777;
      --border-light: rgba(255,255,255,0.06);
      --radius: 28px;
      --radius-sm: 40px;
      --transition: 0.25s ease;
    }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
    }
    .ender-pillars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .pillar {
      position: absolute;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to top, rgba(255,255,255,0) 0%, rgba(200,200,255,0.2) 50%, rgba(255,255,255,0.6) 85%, rgba(255,255,255,0.9) 100%);
      border-radius: 2px;
      animation: glowPulse 4s infinite alternate ease-in-out;
      box-shadow: 0 0 15px rgba(255,255,255,0.08), 0 0 40px rgba(200,200,255,0.03);
    }
    .pillar:nth-child(odd) { animation-duration: 5s; }
    .pillar:nth-child(3n) { animation-duration: 6s; animation-delay: 0.6s; }
    .pillar:nth-child(5n+2) { animation-duration: 3.8s; animation-delay: 1.2s; }
    .pillar:nth-child(7n+4) { animation-duration: 7s; animation-delay: 0.3s; }
    @keyframes glowPulse {
      0% { opacity: 0.25; filter: brightness(0.5); }
      100% { opacity: 0.9; filter: brightness(1.3); }
    }
    .poll-wrapper {
      position: relative;
      z-index: 1;
      max-width: 820px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 40px 36px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid var(--border-light);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 20px;
    }
    .header .shield { font-size: 2.6rem; opacity: 0.8; }
    .header h1 { font-size: 2.0rem; font-weight: 700; letter-spacing: -0.5px; }
    .header .year {
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(255,255,255,0.05);
      padding: 4px 16px;
      border-radius: 40px;
      color: var(--text-secondary);
      margin-left: auto;
      border: 1px solid var(--border-light);
    }
    .step { display: none; animation: fadeIn 0.4s ease; }
    .step.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .step-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      border-left: 4px solid rgba(255,255,255,0.3);
      padding-left: 16px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
    .form-group input {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-light);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: var(--transition);
    }
    .form-group input:focus {
      outline: none;
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.08);
    }
    .form-group .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 4px; }
    .form-group .hint { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .btn {
      border: none;
      padding: 14px 36px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.06);
      color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .btn-primary { background: #fff; color: #0a0a0a; border-color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #e0e0e0; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,255,255,0.1); }
    .btn-primary:disabled { opacity: 0.3; pointer-events: none; }
    .btn-secondary { background: transparent; border-color: rgba(255,255,255,0.15); color: var(--text-secondary); }
    .btn-secondary:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); }
    .btn-sm { padding: 10px 20px; font-size: 0.85rem; }
    .nomination-item {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-light);
    }
    .nomination-item:last-child { border-bottom: none; }
    .nomination-item .nom-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 4px; }
    .nomination-item .nom-sub { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 16px; }

    .autocomplete-wrapper { position: relative; }
    .autocomplete-wrapper input[type="text"] {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-light);
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: var(--transition);
    }
    .autocomplete-wrapper input[type="text"]:focus {
      outline: none;
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.08);
    }
    .autocomplete-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a1f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      margin-top: 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .autocomplete-dropdown.active { display: block; }
    .autocomplete-item {
      padding: 10px 20px;
      cursor: pointer;
      color: #ccc;
      transition: background 0.15s;
      font-size: 0.95rem;
    }
    .autocomplete-item:hover, .autocomplete-item.selected { background: rgba(255,255,255,0.08); color: #fff; }
    .autocomplete-item.top-candidate {
      color: #ffd700;
      font-weight: 600;
    }
    .autocomplete-item.top-candidate::before {
      content: '⭐ ';
    }

    .candidate-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .candidate-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      -webkit-user-select: none;
    }
    .candidate-option:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
    .candidate-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .radio-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .candidate-option input[type="radio"]:checked ~ .radio-circle {
      border-color: #fff;
      background: #fff;
      box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }
    .candidate-option input[type="radio"]:checked ~ .radio-circle::after {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0a0a0a;
    }
    .candidate-option input[type="radio"]:checked ~ span { color: #fff; }
    .candidate-option:has(input[type="radio"]:checked) {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }
    .candidate-option span { flex: 1; }

    .nomination-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .mt-20 { margin-top: 20px; }
    .final-message { text-align: center; padding: 30px 0; }
    .final-message .big-icon { font-size: 4rem; }
    .final-message h2 { font-size: 2rem; margin: 16px 0; }
    .final-message p { color: var(--text-secondary); }
    .blocked-message { text-align: center; padding: 40px 20px; }
    .blocked-message .blocked-icon { font-size: 4rem; }
    .blocked-message h2 { font-size: 1.8rem; margin: 16px 0; color: #ff6b6b; }
    .blocked-message p { color: var(--text-secondary); font-size: 1rem; }

    .admin-panel {
      margin-top: 30px;
      border-top: 1px solid var(--border-light);
      padding-top: 16px;
      text-align: center;
    }
    .admin-panel .admin-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      padding: 6px 12px;
      border-radius: 40px;
    }
    .admin-panel .admin-toggle:hover { background: rgba(255,255,255,0.04); color: #fff; }
    .admin-content { display: none; margin-top: 20px; text-align: left; }
    .admin-content.active { display: block; }
    .admin-login {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.02);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
    }
    .admin-login input {
      flex: 1;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-light);
      color: #fff;
      font-family: inherit;
    }
    .admin-login input:focus { outline: none; border-color: rgba(255,255,255,0.4); }
    .admin-login .error { color: #ff6b6b; font-size: 0.85rem; }
    .admin-dashboard {
      display: none;
      background: rgba(0,0,0,0.3);
      border-radius: var(--radius-sm);
      padding: 16px;
      border: 1px solid var(--border-light);
    }
    .admin-dashboard.active { display: block; }
    .admin-dashboard h3 {
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }
    .admin-table-wrap { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td {
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.06);
      text-align: left;
      vertical-align: top;
    }
    th { background: rgba(255,255,255,0.04); font-weight: 600; color: var(--text-secondary); }
    td { color: var(--text-primary); }
    .admin-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }

    .nick-with-tooltip { cursor: help; border-bottom: 1px dashed rgba(255,255,255,0.3); }

    @media (max-width: 600px) {
      .poll-wrapper { padding: 24px 16px; }
      .header h1 { font-size: 1.5rem; }
      .header .shield { font-size: 2rem; }
      .btn { padding: 12px 24px; font-size: 0.9rem; width: 100%; justify-content: center; }
      .flex-between { flex-direction: column; align-items: stretch; }
      .admin-login { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="ender-pillars" id="pillarsContainer"></div>

<div class="poll-wrapper">
  <div class="header">
    <span class="shield">🐾</span>
    <h1>Nyash Awards</h1>
    <span class="year">2026</span>
  </div>

  <div class="step" id="stepBlocked">
    <div class="blocked-message">
      <div class="blocked-icon">🚫</div>
      <h2>Вы уже голосовали</h2>
      <p>С этого устройства или IP-адреса уже был отправлен голос. Повторное голосование невозможно.</p>
    </div>
  </div>

  <div class="step active" id="stepRegister">
    <div class="step-title">✏️ Представьтесь</div>
    <div class="form-group">
      <label>Ваш ник на сервере</label>
      <input type="text" id="playerNick" placeholder="Введите ник" />
      <div class="error" id="nickError"></div>
    </div>
    <button class="btn btn-primary" id="startBtn">Начать опрос →</button>
  </div>

  <div class="step" id="stepSurvey">
    <div class="step-title">📋 Опрос</div>
    <div id="surveyContainer"></div>
    <div class="flex-between mt-20">
      <span id="progressText" style="color: var(--text-secondary);">0 / 15</span>
      <button class="btn btn-primary" id="submitBtn" disabled>Завершить опрос</button>
    </div>
  </div>

  <div class="step" id="stepFinal">
    <div class="final-message">
      <div class="big-icon">🎉</div>
      <h2>Вы приглашены на Nyash Awards!</h2>
      <p>Спасибо за ваши ответы. Ждём вас на церемонии!</p>
    </div>
  </div>

  <div class="admin-panel">
    <button class="admin-toggle" id="adminToggleBtn">🔐 Админ-панель</button>
    <div class="admin-content" id="adminContent">
      <div class="admin-login" id="adminLogin">
        <input type="password" id="adminPassword" placeholder="Введите пароль" />
        <button class="btn btn-secondary btn-sm" id="adminLoginBtn">Войти</button>
        <span class="error" id="adminLoginError"></span>
      </div>
      <div class="admin-dashboard" id="adminDashboard">
        <h3>📋 Список участников</h3>
        <div class="admin-table-wrap">
          <table>
            <thead><tr><th>Ник</th><th>IP</th><th>Управление</th></tr></thead>
            <tbody id="adminTableBody"></tbody>
          </table>
        </div>
        <div class="admin-actions">
          <button class="btn btn-secondary btn-sm" id="exportJsonBtn">📥 Скачать JSON</button>
          <button class="btn btn-secondary btn-sm" id="adminLogoutBtn">Выйти</button>
        </div>
      </div>
    </div>
  </div>
</div>

  // =============================================================

    best_builder: ['meshokdeneg', 'Strika_Jarvis', 'Mayorcraft', 'Gate_ton'],

  // =============================================================

  // =============================================================
  const NOMINATIONS = [
    { id: 'best_player', title: '🏅 Лучший игрок сезона', subtitle: 'Кто показал наилучшую игру?', type: 'nick' },
    { id: 'best_builder', title: '🏗️ Лучший строитель', subtitle: 'Чьи постройки впечатлили всех?', type: 'nick' },
    { id: 'best_pvp', title: '⚔️ Лучший PvP-игрок', subtitle: 'Кто сильнейший на арене?', type: 'nick' },
    { id: 'best_event', title: '🎉 Лучший ивент сезона', subtitle: 'Какое событие вам запомнилось?', type: 'test', candidates: [
      'игра meshokdeneg "пародия на игру в кальмара"',

    { id: 'best_meme', title: '😂 Лучший мем', subtitle: 'Какой мем запомнился больше всего?', type: 'test', candidates: [

    { id: 'best_admin', title: '🛡️ Лучший администратор', subtitle: 'Кто внёс наибольший вклад в порядок?', type: 'nick' },
    { id: 'best_pve', title: '🧟 Лучший PvE-игрок', subtitle: 'Кто покорял данжи и боссов?', type: 'nick' },
    { id: 'best_noob', title: '🌱 Лучший новичок', subtitle: 'Кто быстро вырос и впечатлил?', type: 'test', candidates: [

    ]},
    { id: 'best_project', title: '📐 Лучший проект', subtitle: 'Какое коллективное творение достойно награды?', type: 'test', candidates: [

    ]},
    { id: 'best_farming', title: '🌾 Лучший фармер', subtitle: 'Кто собрал больше всего ресурсов?', type: 'nick' },
    { id: 'best_redstone', title: '🔌 Лучший редстоун-инженер', subtitle: 'Чьи механизмы поражают воображение?', type: 'nick' },
    { id: 'best_team', title: '🤝 Лучшая PvE-команда', subtitle: 'Какая команда показала лучшую слаженность?', type: 'test', candidates: [
      'Коммунисты',

    ]},
    { id: 'best_guildmaster', title: '🏰 Лучший глава гильдии', subtitle: 'Кто вдохновляет и объединяет игроков?', type: 'nick' },
    { id: 'best_active', title: '🔥 Самый активный игрок', subtitle: 'Кто был на сервере чаще всех?', type: 'nick' },
    { id: 'best_troll', title: '🧌 Главный тролль', subtitle: 'Кто главный тролль сервера?', type: 'nick' }
  ];

  // =============================================================
  //  ОСНОВНАЯ ЛОГИКА
  // =============================================================
  let currentPlayer = { nick: '', answers: {} };
  let userIP = '';

  const $ = id => document.getElementById(id);
  const stepRegister = $('stepRegister');
  const stepSurvey = $('stepSurvey');
  const stepFinal = $('stepFinal');
  const surveyContainer = $('surveyContainer');
  const progressText = $('progressText');
  const submitBtn = $('submitBtn');
  const nickInput = $('playerNick');
  const nickError = $('nickError');
  const startBtn = $('startBtn');

  // =============================================================
  //  IP
  // =============================================================
  async function getIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const d = await r.json();
      return d.ip;
    } catch(e) {
      return 'unknown_' + Date.now();
    }
  }

  // =============================================================
  //  СОХРАНЕНИЕ В GOOGLE SHEETS
  // =============================================================
  async function saveToGoogleSheets(playerData) {
    const { nick, answers } = playerData;
    
    try {
      await fetch(GOOGLE_SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nick: nick,
          ip: userIP,
          date: new Date().toISOString(),
          answers: answers
        })
      });
      console.log('✅ Отправлено в Google Sheets');
      return true;
    } catch(e) {
      console.error('❌ Ошибка:', e);
      return false;
    }
  }

  // =============================================================
  //  ОТРИСОВКА ОПРОСА (С ГЛАВНЫМИ ПРЕТЕНДЕНТАМИ)
  // =============================================================
  function renderSurvey() {
    let html = '';
    let answered = 0;
    const answers = currentPlayer.answers;

    NOMINATIONS.forEach(nom => {
      const answer = answers[nom.id] || null;
      if (answer) answered++;

      html += `<div class="nomination-item" data-id="${nom.id}">`;
      html += `<div class="nom-title">${nom.title}</div>`;
      html += `<div class="nom-sub">${nom.subtitle}</div>`;

      if (nom.type === 'test') {
        html += `<div class="candidate-options">`;
        nom.candidates.forEach(cand => {
          const checked = (answer && answer.value === cand) ? 'checked' : '';
          html += `
            <label class="candidate-option">
              <input type="radio" name="q_${nom.id}" value="${cand}" ${checked} data-id="${nom.id}" />
              <div class="radio-circle"></div>
              <span>${cand}</span>
            </label>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="autocomplete-wrapper">`;
        html += `<input type="text" class="nick-input" data-id="${nom.id}" placeholder="Начните вводить ник..." value="${answer ? answer.value : ''}" autocomplete="off" />`;
        html += `<div class="autocomplete-dropdown" data-id="${nom.id}"></div>`;
        html += `</div>`;
      }

      html += `<div class="nomination-status">${answer ? '✅ Отвечено' : '⏳ Ожидает ответа'}</div>`;
      html += `</div>`;
    });

    surveyContainer.innerHTML = html;
    progressText.textContent = `${answered} / ${NOMINATIONS.length}`;
    submitBtn.disabled = (answered < NOMINATIONS.length);

    // СОБЫТИЯ ДЛЯ РАДИО
    document.querySelectorAll('.candidate-option input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const id = this.dataset.id;
        currentPlayer.answers[id] = { type: 'test', value: this.value };
        updateStatus();
      });
    });

    // СОБЫТИЯ ДЛЯ АВТОДОПОЛНЕНИЯ (С ГЛАВНЫМИ ПРЕТЕНДЕНТАМИ)
    document.querySelectorAll('.nick-input').forEach(input => {
      const id = input.dataset.id;
      const dropdown = document.querySelector(`.autocomplete-dropdown[data-id="${id}"]`);

      // При фокусе — показываем главных претендентов
      input.addEventListener('focus', function() {
        showTopCandidates(dropdown, id);
      });

      input.addEventListener('input', function() {
        const val = this.value.trim();
        if (val) {
          currentPlayer.answers[id] = { type: 'nick', value: val };
          showAutocomplete(this, dropdown, id);
        } else {
          delete currentPlayer.answers[id];
          showTopCandidates(dropdown, id);
        }
        updateStatus();
      });

      input.addEventListener('blur', function() {
        setTimeout(() => { dropdown.classList.remove('active'); }, 200);
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); navigateDropdown(dropdown, 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); navigateDropdown(dropdown, -1); }
        else if (e.key === 'Enter') { e.preventDefault(); selectCurrentDropdown(dropdown, input); }
        else if (e.key === 'Escape') { dropdown.classList.remove('active'); }
      });
    });
  }

  // ПОКАЗЫВАЕМ ГЛАВНЫХ ПРЕТЕНДЕНТОВ (при пустом поле)
  function showTopCandidates(dropdown, id) {
    dropdown.innerHTML = '';
    const top = TOP_CANDIDATES[id] || [];
    if (top.length === 0) {
      dropdown.classList.remove('active');
      return;
    }

    top.forEach(nick => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item top-candidate';
      div.textContent = nick;
      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        const input = document.querySelector(`.nick-input[data-id="${id}"]`);
        input.value = nick;
        currentPlayer.answers[id] = { type: 'nick', value: nick };
        updateStatus();
        dropdown.classList.remove('active');
      });
      dropdown.appendChild(div);
    });
    dropdown.classList.add('active');
  }

  // ОБЫЧНЫЙ ПОИСК (при вводе текста)
  function showAutocomplete(input, dropdown, id) {
    const val = input.value.toLowerCase().trim();
    dropdown.innerHTML = '';
    
    if (!val) {
      dropdown.classList.remove('active');
      return;
    }

    let matches = ALL_NICKS.filter(nick => nick.toLowerCase().startsWith(val));
    if (matches.length === 0) { dropdown.classList.remove('active'); return; }

    const top = TOP_CANDIDATES[id] || [];
    const sorted = [...top.filter(t => t.toLowerCase().startsWith(val)), ...matches.filter(m => !top.includes(m))];

    sorted.slice(0, 6).forEach(nick => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      if (top.includes(nick)) div.classList.add('top-candidate');
      div.textContent = nick;
      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        input.value = nick;
        currentPlayer.answers[id] = { type: 'nick', value: nick };
        updateStatus();
        dropdown.classList.remove('active');
      });
      dropdown.appendChild(div);
    });
    dropdown.classList.add('active');
  }

  function navigateDropdown(dropdown, direction) {
    const items = dropdown.querySelectorAll('.autocomplete-item');
    if (items.length === 0) return;
    let selected = dropdown.querySelector('.autocomplete-item.selected');
    let idx = selected ? Array.from(items).indexOf(selected) : -1;
    if (selected) selected.classList.remove('selected');
    idx += direction;
    if (idx >= items.length) idx = 0;
    if (idx < 0) idx = items.length - 1;
    items[idx].classList.add('selected');
    items[idx].scrollIntoView({ block: 'nearest' });
  }

  function selectCurrentDropdown(dropdown, input) {
    const selected = dropdown.querySelector('.autocomplete-item.selected');
    if (selected) {
      input.value = selected.textContent;
      const id = input.dataset.id;
      currentPlayer.answers[id] = { type: 'nick', value: selected.textContent };
      updateStatus();
      dropdown.classList.remove('active');
    }
  }

  function updateStatus() {
    let answered = 0;
    NOMINATIONS.forEach(nom => {
      if (currentPlayer.answers[nom.id]) answered++;
    });
    progressText.textContent = `${answered} / ${NOMINATIONS.length}`;
    submitBtn.disabled = (answered < NOMINATIONS.length);

    document.querySelectorAll('.nomination-item').forEach(item => {
      const id = item.dataset.id;
      const status = item.querySelector('.nomination-status');
      if (currentPlayer.answers[id]) {
        status.textContent = '✅ Отвечено';
      } else {
        status.textContent = '⏳ Ожидает ответа';
      }
    });
  }

  // =============================================================
  //  ЗАПУСК
  // =============================================================
  startBtn.addEventListener('click', async function() {
    const nick = nickInput.value.trim();
    if (!nick) { nickError.textContent = 'Введите ник'; return; }
    nickError.textContent = '';
    userIP = await getIP();

    // Проверяем IP
    const stored = localStorage.getItem('nyash_voted_ips') || '[]';
    const votedIPs = JSON.parse(stored);
    if (votedIPs.includes(userIP)) {
      alert('С этого IP уже голосовали!');
      return;
    }

    currentPlayer.nick = nick;
    currentPlayer.answers = {};
    stepRegister.classList.remove('active');
    stepSurvey.classList.add('active');
    renderSurvey();
  });

  submitBtn.addEventListener('click', async function() {
    const allAnswered = NOMINATIONS.every(nom => currentPlayer.answers[nom.id]);
    if (!allAnswered) {
      alert('Ответьте на все вопросы!');
      return;
    }

    // Сохраняем IP
    const stored = localStorage.getItem('nyash_voted_ips') || '[]';
    const votedIPs = JSON.parse(stored);
    votedIPs.push(userIP);
    localStorage.setItem('nyash_voted_ips', JSON.stringify(votedIPs));

    // Сохраняем в Google Sheets
    await saveToGoogleSheets(currentPlayer);

    stepSurvey.classList.remove('active');
    stepFinal.classList.add('active');
  });

  // =============================================================
  //  АДМИН-ПАНЕЛЬ
  // =============================================================
  let adminLoggedIn = false;
  let allPlayers = [];
  let allIPs = [];

  function loadAllPlayers() {
    try { allPlayers = JSON.parse(localStorage.getItem('nyash_all_players')) || []; } catch(e) { allPlayers = []; }
  }
  function saveAllPlayers() { localStorage.setItem('nyash_all_players', JSON.stringify(allPlayers)); }
  function loadAllIPs() {
    try { allIPs = JSON.parse(localStorage.getItem('nyash_all_ips')) || []; } catch(e) { allIPs = []; }
  }
  function saveAllIPs() { localStorage.setItem('nyash_all_ips', JSON.stringify(allIPs)); }

  function deletePlayer(nick) {
    if (!confirm(`Удалить игрока ${nick}?`)) return;
    const player = allPlayers.find(p => p.nick === nick);
    if (player && player.ip) {
      allIPs = allIPs.filter(ip => ip !== player.ip);
      saveAllIPs();
    }
    allPlayers = allPlayers.filter(p => p.nick !== nick);
    saveAllPlayers();
    renderAdminTable();
    alert(`${nick} удалён!`);
  }

  function renderAdminTable() {
    const tbody = $('adminTableBody');
    tbody.innerHTML = '';
    if (allPlayers.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#888;">Нет данных</td></tr>';
      return;
    }
    allPlayers.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.nick}</td>
        <td>${p.ip || 'неизвестно'}</td>
        <td><button class="btn btn-sm" style="background:#ff4444;color:#fff;border:none;padding:4px 12px;border-radius:12px;cursor:pointer;" onclick="deletePlayer('${p.nick}')">🗑️</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportJson() {
    const data = { players: allPlayers, usedIPs: allIPs, exportDate: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nyash_awards_data.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('adminToggleBtn').addEventListener('click', function() {
    const active = $('adminContent').classList.toggle('active');
    this.textContent = active ? '🔒 Скрыть админ-панель' : '🔐 Админ-панель';
    if (active && adminLoggedIn) {
      $('adminLogin').style.display = 'none';
      $('adminDashboard').classList.add('active');
      renderAdminTable();
    } else if (active) {
      $('adminLogin').style.display = 'flex';
      $('adminDashboard').classList.remove('active');
    }
  });

  $('adminLoginBtn').addEventListener('click', function() {
    if ($('adminPassword').value.trim() === 'admin123') {
      adminLoggedIn = true;
      $('adminLogin').style.display = 'none';
      $('adminDashboard').classList.add('active');
      $('adminLoginError').textContent = '';
      loadAllPlayers();
      loadAllIPs();
      renderAdminTable();
    } else {
      $('adminLoginError').textContent = 'Неверный пароль';
    }
  });

  $('adminPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') $('adminLoginBtn').click();
  });

  $('adminLogoutBtn').addEventListener('click', function() {
    adminLoggedIn = false;
    $('adminLogin').style.display = 'flex';
    $('adminDashboard').classList.remove('active');
    $('adminPassword').value = '';
    $('adminLoginError').textContent = '';
  });

  $('exportJsonBtn').addEventListener('click', exportJson);

  // =============================================================
  //  ИНИЦИАЛИЗАЦИЯ
  // =============================================================
  document.addEventListener('DOMContentLoaded', function() {
    // Всё готово
  });
</script>
</body>
</html>
