<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyash Awards · Голосование</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(20,20,30,0.9);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    h1 { text-align: center; margin-bottom: 10px; font-size: 2rem; }
    .sub { text-align: center; color: #888; margin-bottom: 20px; }
    .step { display: none; }
    .step.active { display: block; }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1f;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    button {
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover { background: #ddd; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error { color: #ff4444; font-size: 0.85rem; margin-top: 5px; }
    .question {
      background: #1a1a1f;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 3px solid #ffd700;
    }
    .question .title { font-weight: bold; font-size: 1.1rem; }
    .question .subtitle { color: #888; font-size: 0.9rem; margin: 5px 0 10px; }
    .options label {
      display: block;
      padding: 8px 12px;
      margin: 4px 0;
      background: #111;
      border-radius: 8px;
      cursor: pointer;
    }
    .options label:hover { background: #222; }
    .options input[type="radio"] { width: auto; margin-right: 10px; }
    .options input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; background: #111; border: 1px solid #333; color: #fff; border-radius: 6px; }
    .status { color: #888; font-size: 0.85rem; margin-top: 5px; }
    .progress { text-align: center; color: #888; margin: 15px 0; }
    .final { text-align: center; padding: 30px 0; }
    .final h2 { font-size: 2rem; color: #ffd700; }
    .final .date { font-size: 1.5rem; color: #ffd700; margin: 10px 0; }
    .saved-msg {
      text-align: center;
      padding: 10px;
      background: #1a3a1a;
      border-radius: 10px;
      margin-top: 15px;
      color: #4caf50;
      display: none;
    }
    .saved-msg.show { display: block; }
    .cookie-consent {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      padding: 15px 20px;
      display: none;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      border-top: 1px solid #222;
      z-index: 999;
    }
    .cookie-consent.show { display: flex; }
    .cookie-consent .text { color: #888; font-size: 0.9rem; text-align: center; }
    .cookie-consent .btn { background: #fff; color: #000; padding: 8px 24px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; }
    .cookie-consent .btn:hover { background: #ddd; }
    @media (max-width: 600px) {
      .container { padding: 15px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🐾 Nyash Awards</h1>
  <div class="sub">Голосование 2026</div>

  <!-- КУКИ -->
  <div class="cookie-consent" id="cookieConsent">
    <div class="text">Мы используем cookie для защиты от повторного голосования.</div>
    <button class="btn" id="acceptBtn">Согласен</button>
  </div>

  <!-- ШАГ 1: РЕГИСТРАЦИЯ -->
  <div class="step active" id="stepRegister">
    <h3>✏️ Представьтесь</h3>
    <input type="text" id="playerNick" placeholder="Ваш ник на сервере" />
    <div class="error" id="nickError"></div>
    <button id="startBtn">Начать опрос →</button>
  </div>

  <!-- ШАГ 2: ОПРОС -->
  <div class="step" id="stepSurvey">
    <div id="questions"></div>
    <div class="progress" id="progressText">0 / 15</div>
    <button id="submitBtn" disabled>Завершить опрос</button>
  </div>

  <!-- ШАГ 3: ФИНАЛ -->
  <div class="step" id="stepFinal">
    <div class="final">
      <div style="font-size: 4rem;">🎉</div>
      <h2>Спасибо за то, что проголосовали!</h2>
      <div style="font-size: 1.4rem; margin: 10px 0;">Вы приглашены на</div>
      <div class="date">Nyash Awards 00.08.2026</div>
      <p style="color: #888; margin-top: 10px;">До встречи на церемонии! 🐾</p>
      <div class="saved-msg" id="savedMsg">✅ Ваш голос сохранён в Google Таблице!</div>
    </div>
  </div>
</div>

<script>
  // =============================================================
  //  GOOGLE SHEETS — ТВОЙ URL УЖЕ ВСТАВЛЕН
  // =============================================================
  const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzvTeId9tfUtVWjVYTsnCr_6uQmnuj8sW-oZLK4BEgcN3J1XqHvGl9JdcuTubA5NQ19/exec';

  // =============================================================
  //  НОМИНАЦИИ
  // =============================================================
  const NOMINATIONS = [
    { id: 'best_player', title: '🏅 Лучший игрок сезона', subtitle: 'Кто показал наилучшую игру?', type: 'nick' },
    { id: 'best_builder', title: '🏗️ Лучший строитель', subtitle: 'Чьи постройки впечатлили всех?', type: 'nick' },
    { id: 'best_pvp', title: '⚔️ Лучший PvP-игрок', subtitle: 'Кто сильнейший на арене?', type: 'nick' },
    { id: 'best_event', title: '🎉 Лучший ивент сезона', subtitle: 'Какое событие вам запомнилось?', type: 'test', candidates: [
      'игра meshokdeneg "пародия на игру в кальмара"',
      'данж Анатолия', 'испытания Strika', 'красный круг'
    ]},
    { id: 'best_meme', title: '😂 Лучший мем', subtitle: 'Какой мем запомнился больше всего?', type: 'test', candidates: [
      'ядерка', 'пивной дом', 'ЭТО СПАРТА!!!!!', 'дай опку'
    ]},
    { id: 'best_admin', title: '🛡️ Лучший администратор', subtitle: 'Кто внёс наибольший вклад в порядок?', type: 'nick' },
    { id: 'best_pve', title: '🧟 Лучший PvE-игрок', subtitle: 'Кто покорял данжи и боссов?', type: 'nick' },
    { id: 'best_noob', title: '🌱 Лучший новичок', subtitle: 'Кто быстро вырос и впечатлил?', type: 'nick' },
    { id: 'best_project', title: '📐 Лучший проект', subtitle: 'Какое коллективное творение достойно награды?', type: 'test', candidates: [
      'данж Анатолия', 'база админов', 'бар Лорда', 'общага'
    ]},
    { id: 'best_farming', title: '🌾 Лучший фармер', subtitle: 'Кто собрал больше всего ресурсов?', type: 'nick' },
    { id: 'best_redstone', title: '🔌 Лучший редстоун-инженер', subtitle: 'Чьи механизмы поражают воображение?', type: 'nick' },
    { id: 'best_team', title: '🤝 Лучшая PvE-команда', subtitle: 'Какая команда показала лучшую слаженность?', type: 'test', candidates: [
      'Коммунисты', 'Демократы', 'Анархисты'
    ]},
    { id: 'best_guildmaster', title: '🏰 Лучший глава гильдии', subtitle: 'Кто вдохновляет и объединяет игроков?', type: 'nick' },
    { id: 'best_active', title: '🔥 Самый активный игрок', subtitle: 'Кто был на сервере чаще всех?', type: 'nick' },
    { id: 'best_troll', title: '🧌 Главный тролль', subtitle: 'Кто главный тролль сервера?', type: 'nick' }
  ];

  const ALL_NICKS = [
    'Strika_Jarvis', 'Gate_ton', 'Tigr65789', 'livitody', 'meshokdeneg',
    'AppleTob', 'roma_1917', 'blebik❤️', 'Lord15986', 'Mayorcraft',
    'nevertajm', 'tomatoma', 'Stalker', 'Diller',
    'GG_Chaika', 'meshokRoma', 'Piska_mamonta'
  ];

  const TOP_CANDIDATES = {
    best_player: ['Mayorcraft', 'meshokdeneg', 'blebik❤️', 'Gate_ton'],
    best_builder: ['meshokdeneg', 'Strika_Jarvis', 'livitody', 'Mayorcraft'],
    best_pvp: ['blebik❤️', 'Gate_ton', 'Mayorcraft', 'meshokRoma'],
    best_admin: ['AppleTob', 'meshokdeneg', 'Mayorcraft', 'Strika_Jarvis'],
    best_pve: ['blebik❤️', 'Gate_ton', 'Stalker', 'tomatoma'],
    best_noob: ['tomatoma', 'Stalker', 'Piska_mamonta', 'GG_Chaika'],
    best_farming: ['Gate_ton', 'tomatoma', 'Stalker', 'livitody'],
    best_redstone: ['meshokdeneg', 'Strika_Jarvis', 'livitody', 'Mayorcraft'],
    best_guildmaster: ['meshokdeneg', 'Mayorcraft', 'Lord15986', 'Gate_ton'],
    best_active: ['blebik❤️', 'meshokdeneg', 'Strika_Jarvis', 'Gate_ton'],
    best_troll: ['Gate_ton', 'meshokdeneg', 'AppleTob', 'Mayorcraft']
  };

  // =============================================================
  //  ЛОГИКА
  // =============================================================
  let currentPlayer = { nick: '', answers: {} };
  let userIP = '';

  const $ = id => document.getElementById(id);
  const stepRegister = $('stepRegister');
  const stepSurvey = $('stepSurvey');
  const stepFinal = $('stepFinal');
  const questionsDiv = $('questions');
  const progressText = $('progressText');
  const submitBtn = $('submitBtn');
  const nickInput = $('playerNick');
  const nickError = $('nickError');
  const startBtn = $('startBtn');
  const savedMsg = $('savedMsg');

  // COOKIE
  (function() {
    if (localStorage.getItem('nyash_cookie') !== 'accepted') {
      document.getElementById('cookieConsent').classList.add('show');
    }
    document.getElementById('acceptBtn').addEventListener('click', function() {
      localStorage.setItem('nyash_cookie', 'accepted');
      document.getElementById('cookieConsent').classList.remove('show');
    });
  })();

  // IP
  async function getIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const d = await r.json();
      return d.ip;
    } catch(e) {
      return 'unknown_' + Date.now();
    }
  }

  // СОХРАНЕНИЕ В GOOGLE SHEETS
  async function saveToGoogleSheets(playerData) {
    const { nick, answers } = playerData;
    
    try {
      const response = await fetch(GOOGLE_SHEETS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          nick: nick,
          ip: userIP,
          date: new Date().toISOString(),
          answers: answers
        })
      });
      
      console.log('✅ Отправлено в Google Sheets');
      return true;
    } catch(e) {
      console.error('❌ Ошибка:', e);
      return false;
    }
  }

  // ОТРИСОВКА ОПРОСА
  function renderSurvey() {
    let html = '';
    let answered = 0;
    const answers = currentPlayer.answers;

    NOMINATIONS.forEach(nom => {
      const answer = answers[nom.id] || null;
      if (answer) answered++;

      html += `<div class="question" data-id="${nom.id}">`;
      html += `<div class="title">${nom.title}</div>`;
      html += `<div class="subtitle">${nom.subtitle}</div>`;

      if (nom.type === 'test') {
        html += `<div class="options">`;
        nom.candidates.forEach(cand => {
          const checked = (answer && answer.value === cand) ? 'checked' : '';
          html += `<label>
            <input type="radio" name="q_${nom.id}" value="${cand}" ${checked} data-id="${nom.id}" />
            ${cand}
          </label>`;
        });
        html += `</div>`;
      } else {
        html += `<div class="options">`;
        html += `<input type="text" class="nick-input" data-id="${nom.id}" placeholder="Введите ник..." value="${answer ? answer.value : ''}" />`;
        html += `<div class="nick-suggest" data-id="${nom.id}" style="display:none;background:#222;border-radius:6px;margin-top:4px;"></div>`;
        html += `</div>`;
      }

      html += `<div class="status">${answer ? '✅ Отвечено' : '⏳ Ожидает ответа'}</div>`;
      html += `</div>`;
    });

    questionsDiv.innerHTML = html;
    progressText.textContent = `${answered} / ${NOMINATIONS.length}`;
    submitBtn.disabled = (answered < NOMINATIONS.length);

    // СОБЫТИЯ
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', function() {
        const id = this.dataset.id;
        currentPlayer.answers[id] = { type: 'test', value: this.value };
        updateStatus();
      });
    });

    document.querySelectorAll('.nick-input').forEach(input => {
      const id = input.dataset.id;
      const suggestDiv = document.querySelector(`.nick-suggest[data-id="${id}"]`);

      input.addEventListener('input', function() {
        const val = this.value.trim();
        if (val) {
          currentPlayer.answers[id] = { type: 'nick', value: val };
        } else {
          delete currentPlayer.answers[id];
        }
        updateStatus();
        showSuggestions(this, suggestDiv, id);
      });

      input.addEventListener('focus', function() {
        showSuggestions(this, suggestDiv, id);
      });

      input.addEventListener('blur', function() {
        setTimeout(() => { suggestDiv.style.display = 'none'; }, 200);
      });
    });
  }

  function showSuggestions(input, suggestDiv, id) {
    const val = input.value.toLowerCase().trim();
    suggestDiv.innerHTML = '';
    if (!val) { suggestDiv.style.display = 'none'; return; }

    const matches = ALL_NICKS.filter(n => n.toLowerCase().startsWith(val));
    if (matches.length === 0) { suggestDiv.style.display = 'none'; return; }

    const top = TOP_CANDIDATES[id] || [];
    const allMatches = [...top.filter(t => t.toLowerCase().startsWith(val)), ...matches.filter(m => !top.includes(m))];

    suggestDiv.style.display = 'block';
    allMatches.slice(0, 6).forEach(nick => {
      const div = document.createElement('div');
      div.style.cssText = 'padding:6px 10px;cursor:pointer;border-bottom:1px solid #222;';
      if (top.includes(nick)) div.style.color = '#ffd700';
      div.textContent = nick;
      div.onmousedown = function(e) {
        e.preventDefault();
        input.value = nick;
        currentPlayer.answers[id] = { type: 'nick', value: nick };
        updateStatus();
        suggestDiv.style.display = 'none';
      };
      suggestDiv.appendChild(div);
    });
  }

  function updateStatus() {
    let answered = 0;
    NOMINATIONS.forEach(nom => {
      if (currentPlayer.answers[nom.id]) answered++;
    });
    progressText.textContent = `${answered} / ${NOMINATIONS.length}`;
    submitBtn.disabled = (answered < NOMINATIONS.length);

    document.querySelectorAll('.question').forEach(q => {
      const id = q.dataset.id;
      const status = q.querySelector('.status');
      if (currentPlayer.answers[id]) {
        status.textContent = '✅ Отвечено';
      } else {
        status.textContent = '⏳ Ожидает ответа';
      }
    });
  }

  // === ЗАПУСК ===
  startBtn.addEventListener('click', async function() {
    const nick = nickInput.value.trim();
    if (!nick) { nickError.textContent = 'Введите ник'; return; }
    nickError.textContent = '';
    userIP = await getIP();

    // Проверяем, не голосовал ли уже этот IP
    const stored = localStorage.getItem('nyash_voted_ips') || '[]';
    const votedIPs = JSON.parse(stored);
    if (votedIPs.includes(userIP)) {
      alert('С этого IP уже голосовали!');
      return;
    }

    currentPlayer.nick = nick;
    currentPlayer.answers = {};
    stepRegister.classList.remove('active');
    stepSurvey.classList.add('active');
    renderSurvey();
  });

  submitBtn.addEventListener('click', async function() {
    const allAnswered = NOMINATIONS.every(nom => currentPlayer.answers[nom.id]);
    if (!allAnswered) {
      alert('Ответьте на все вопросы!');
      return;
    }

    // Сохраняем IP
    const stored = localStorage.getItem('nyash_voted_ips') || '[]';
    const votedIPs = JSON.parse(stored);
    votedIPs.push(userIP);
    localStorage.setItem('nyash_voted_ips', JSON.stringify(votedIPs));

    // Сохраняем в Google Sheets
    await saveToGoogleSheets(currentPlayer);
    
    savedMsg.classList.add('show');
    stepSurvey.classList.remove('active');
    stepFinal.classList.add('active');
  });
</script>
</body>
</html>
